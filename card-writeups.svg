<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="HTB-Writeups: Hack The Box writeups, tools and notes. Each one has a scope note, the attack chain, every stage with commands and output, and the mistakes I made kept in so I can learn from them."><title>HTB-Writeups</title><style>@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
