<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="AI-Recon-Agent: Recon agent for practising offensive-security methodology: recon loops on the red side, log hunting on the blue side, both mapped to MITRE ATT&amp;CK, with a fail-closed scope check on every network call."><title>AI-Recon-Agent</title><style>@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'CP';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'JBM',ui-monospace,Consolas,Menlo,monospace} .d{font-family:'CP','Segoe UI',system-ui,sans-serif} .b{font-family:'PX','Segoe UI',system-ui,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(16px,-12px);opacity:.9}}
@keyframes rise{}
@keyframes pulse{50%{opacity:.35}}
.rise{}
.blink{animation:blink 1s steps(1) infinite}
.dot{fill:#78aaff;animation:drift 9s ease-in-out infinite}

.c62sw{transform:translateX(-270px);animation:c62sw 8s ease-out 1.6s infinite}
