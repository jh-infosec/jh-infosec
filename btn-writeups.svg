<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="218" height="64" viewBox="0 0 218 64" role="img" aria-label="Htb Writeups"><title>Htb Writeups</title><style>@font-face{font-family:'CP';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}

