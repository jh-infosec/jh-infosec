<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Maltriage: Static malware triage pipeline for safe file analysis: hashes, magic-byte format ID, streaming entropy and severity-ranked JSON findings. Reads each sample once with flat memory; 75 tests."><title>Maltriage</title><style>@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
