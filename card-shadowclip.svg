</g>
<rect x="1" y="1" width="598" height="328" rx="10" fill="none" stroke="rgba(77,141,255,.42)" stroke-opacity=".7"/>
<g clip-path="url(#c64frame)"><circle cx="610" cy="-10" r="120" fill="url(#c64orb)" class="c64o"/></g><rect x="30" y="30" width="122.0" height="26" rx="3" fill="none" stroke="rgba(77,141,255,.42)"/><text x="40.0" y="47.5" class="m" font-size="11.5" font-weight="500" fill="#9cc2ff" letter-spacing="1.6" >KALI TOOLING</text><text x="570.0" y="48.0" class="m" font-size="13" font-weight="500" fill="#5be3a0" text-anchor="end" >v0.5.3</text><text x="30.0" y="104.0" class="d" font-size="32" font-weight="700" fill="#eef4ff" filter="url(#c64soft)">ShadowClip</text><text x="30.0" y="138.0" class="b" font-size="15.5" font-weight="400" fill="#7d90b0" >Clipboard history popup for Kali and other X11 desktops, with pinning, live</text><text x="30.0" y="161.5" class="b" font-size="15.5" font-weight="400" fill="#7d90b0" >search and a secret filter that keeps credentials out of history, which lives in</text><text x="30.0" y="185.0" class="b" font-size="15.5" font-weight="400" fill="#7d90b0" >tmpfs and never touches disk.</text><rect x="30.0" y="274" width="61.2" height="26" rx="3" fill="#4d8dff" fill-opacity=".08" stroke="rgba(77,141,255,.16)"/><text x="39.0" y="291.5" class="m" font-size="12" font-weight="500" fill="#d5e1f4" >Python</text><rect x="99.2" y="274" width="46.8" height="26" rx="3" fill="#4d8dff" fill-opacity=".08" stroke="rgba(77,141,255,.16)"/><text x="108.2" y="291.5" class="m" font-size="12" font-weight="500" fill="#d5e1f4" >GTK3</text><rect x="154.0" y="274" width="68.4" height="26" rx="3" fill="#4d8dff" fill-opacity=".08" stroke="rgba(77,141,255,.16)"/><text x="163.0" y="291.5" class="m" font-size="12" font-weight="500" fill="#d5e1f4" >systemd</text><g class="c64a"><text x="570" y="292" text-anchor="end" class="m" font-size="14" font-weight="500" fill="#9cc2ff">↗</text></g></svg>