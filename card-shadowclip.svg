<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="ShadowClip: Clipboard history popup for Kali and other X11 desktops, with pinning, live search and a secret filter that keeps credentials out of history, which lives in tmpfs and never touches disk."><title>ShadowClip</title><style>@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'CP';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'JBM',ui-monospace,Consolas,Menlo,monospace} .d{font-family:'CP','Segoe UI',system-ui,sans-serif} .b{font-family:'PX','Segoe UI',system-ui,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(16px,-12px);opacity:.9}}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
@keyframes pulse{50%{opacity:.35}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.blink{animation:blink 1s steps(1) infinite}
.dot{fill:#78aaff;animation:drift 9s ease-in-out infinite}

.c64sw{transform:translateX(-270px);animation:c64sw 8s ease-out 4.0s infinite}
@keyframes c64sw{0%{transform:translateX(-270px)}22%,100%{transform:translateX(660px)}}
.c64o{animation:pulse 4s ease-in-out 4.0s infinite}</style><defs>
<linearGradient id="c64bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1a"/><stop offset="1" stop-color="#04080f"/></linearGradient>
<radialGradient id="c64gA" cx="82%" cy="-8%" r="70%"><stop offset="0" stop-color="#4d8dff" stop-opacity=".2"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
<radialGradient id="c64gB" cx="-8%" cy="70%" r="55%"><stop offset="0" stop-color="#4d8dff" stop-opacity=".1"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
<pattern id="c64scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#4d8dff" fill-opacity=".045"/></pattern>
<linearGradient id="c64sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff" stop-opacity="0"/><stop offset=".5" stop-color="#4d8dff" stop-opacity=".13"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></linearGradient>
<clipPath id="c64frame"><rect x="1" y="1" width="598" height="328" rx="10"/></clipPath>
<filter id="c64glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="c64soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="c64orb"><stop offset="0" stop-color="#4d8dff" stop-opacity=".28"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="598" height="328" rx="10" fill="url(#c64bg)"/>
<g clip-path="url(#c64frame)">
<rect width="600" height="330" fill="url(#c64gA)"/><rect width="600" height="330" fill="url(#c64gB)"/>
<circle class="dot" cx="287" cy="204" r="1.5" style="animation-delay:-4.8s;animation-duration:11.1s"/><circle class="dot" cx="134" cy="95" r="1.8" style="animation-delay:-7.2s;animation-duration:8.2s"/><circle class="dot" cx="479" cy="211" r="1.2" style="animation-delay:-0.7s;animation-duration:9.5s"/><circle class="dot" cx="131" cy="21" r="1.5" style="animation-delay:-6.1s;animation-duration:7.0s"/><circle class="dot" cx="56" cy="46" r="1.2" style="animation-delay:-8.6s;animation-duration:8.6s"/><circle class="dot" cx="322" cy="41" r="1.2" style="animation-delay:-6.9s;animation-duration:9.4s"/><circle class="dot" cx="140" cy="238" r="1.8" style="animation-delay:-3.8s;animation-duration:10.1s"/><circle class="dot" cx="439" cy="222" r="1.8" style="animation-delay:-1.6s;animation-duration:7.0s"/>
<rect width="600" height="330" fill="url(#c64scan)"/>
