<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="228" height="64" viewBox="0 0 228 64" role="img" aria-label="View Projects"><title>View Projects</title><style>@font-face{font-family:'CP';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'JBM',ui-monospace,Consolas,Menlo,monospace} .d{font-family:'CP','Segoe UI',system-ui,sans-serif} .b{font-family:'PX','Segoe UI',system-ui,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(16px,-12px);opacity:.9}}
@keyframes rise{}
@keyframes pulse{50%{opacity:.35}}
.rise{}
.blink{animation:blink 1s steps(1) infinite}
.dot{fill:#78aaff;animation:drift 9s ease-in-out infinite}
.bglow{opacity:.55;animation:bp 2.8s ease-in-out infinite}@keyframes bp{50%{opacity:.95}}
.bsh{transform:translateX(-90px);animation:bsh 3.6s ease-in-out 1s infinite}@keyframes bsh{0%{transform:translateX(-90px)}35%,100%{transform:translateX(248px)}}</style><defs><linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="bg" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="bc"><rect x="8" y="8" width="212" height="48" rx="4"/></clipPath></defs>
<g class="bglow"><rect x="2" y="2" width="224" height="60" rx="9" fill="#4d8dff" fill-opacity=".12"/><rect x="5" y="5" width="218" height="54" rx="6" fill="#4d8dff" fill-opacity=".2"/></g>
<rect x="8" y="8" width="212" height="48" rx="4" fill="#4d8dff"/>
<g clip-path="url(#bc)"><rect class="bsh" x="0" y="0" width="70" height="64" fill="url(#bs)"/></g>
<text x="114.0" y="38.0" text-anchor="middle" class="d" font-size="17" font-weight="600" letter-spacing="1" fill="#02060d">VIEW PROJECTS  →</text></svg>