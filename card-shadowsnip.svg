<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="ShadowSnip: Snipping tool for pentest evidence on Windows and Linux. Snips land on the clipboard compressed, get marked up and redacted in place, then numbered and filed by section into a lab.md report."><title>ShadowSnip</title><style>@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'CP';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'JBM',ui-monospace,Consolas,Menlo,monospace} .d{font-family:'CP','Segoe UI',system-ui,sans-serif} .b{font-family:'PX','Segoe UI',system-ui,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(16px,-12px);opacity:.9}}
@keyframes rise{}
@keyframes pulse{50%{opacity:.35}}
.rise{}
.blink{animation:blink 1s steps(1) infinite}
.dot{fill:#78aaff;animation:drift 9s ease-in-out infinite}

.c63sw{transform:translateX(-270px);animation:c63sw 8s ease-out 2.8s infinite}
@keyframes c63sw{0%{transform:translateX(-270px)}22%,100%{transform:translateX(660px)}}
.c63o{animation:pulse 4s ease-in-out 2.8s infinite}</style><defs>
<linearGradient id="c63bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1a"/><stop offset="1" stop-color="#04080f"/></linearGradient>
<radialGradient id="c63gA" cx="82%" cy="-8%" r="70%"><stop offset="0" stop-color="#4d8dff" stop-opacity=".2"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
<radialGradient id="c63gB" cx="-8%" cy="70%" r="55%"><stop offset="0" stop-color="#4d8dff" stop-opacity=".1"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
<pattern id="c63scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#4d8dff" fill-opacity=".045"/></pattern>
<linearGradient id="c63sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff" stop-opacity="0"/><stop offset=".5" stop-color="#4d8dff" stop-opacity=".13"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></linearGradient>
<clipPath id="c63frame"><rect x="1" y="1" width="598" height="328" rx="10"/></clipPath>
<filter id="c63glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="c63soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="c63orb"><stop offset="0" stop-color="#4d8dff" stop-opacity=".28"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="598" height="328" rx="10" fill="url(#c63bg)"/>
<g clip-path="url(#c63frame)">
<rect width="600" height="330" fill="url(#c63gA)"/><rect width="600" height="330" fill="url(#c63gB)"/>
<circle class="dot" cx="269" cy="103" r="1.5" style="animation-delay:-4.4s;animation-duration:7.5s"/><circle class="dot" cx="440" cy="37" r="1.2" style="animation-delay:-2.6s;animation-duration:12.0s"/><circle class="dot" cx="192" cy="239" r="1.2" style="animation-delay:-2.0s;animation-duration:12.1s"/><circle class="dot" cx="508" cy="113" r="1.5" style="animation-delay:-5.4s;animation-duration:7.2s"/><circle class="dot" cx="39" cy="288" r="1.8" style="animation-delay:-6.4s;animation-duration:8.4s"/>
<rect class="c63sw" x="0" y="0" width="240" height="330" fill="url(#c63sweep)"/>
</g>
<rect x="1" y="1" width="598" height="328" rx="10" fill="none" stroke="rgba(77,141,255,.42)" stroke-opacity=".7"/>
<g clip-path="url(#c63frame)"><circle cx="610" cy="-10" r="120" fill="url(#c63orb)" class="c63o"/></g><rect x="30" y="30" width="156.0" height="26" rx="3" fill="none" stroke="rgba(77,141,255,.42)"/><text x="40.0" y="47.5" class="m" font-size="11.5" font-weight="500" fill="#9cc2ff" letter-spacing="1.6" >PENTEST EVIDENCE</text><text x="30.0" y="104.0" class="d" font-size="32" font-weight="700" fill="#eef4ff">ShadowSnip</text><text x="30.0" y="138.0" class="b" font-size="15.5" font-weight="400" fill="#7d90b0" >Snipping tool for pentest evidence on Windows and Linux. Snips land on the</text><text x="30.0" y="161.5" class="b" font-size="15.5" font-weight="400" fill="#7d90b0" >clipboard compressed, get marked up and redacted in place, then numbered</text><text x="30.0" y="185.0" class="b" font-size="15.5" font-weight="400" fill="#7d90b0" >and filed by section into a lab.md report.</text><rect x="30.0" y="274" width="61.2" height="26" rx="3" fill="#4d8dff" fill-opacity=".08" stroke="rgba(77,141,255,.16)"/><text x="39.0" y="291.5" class="m" font-size="12" font-weight="500" fill="#d5e1f4" >Python</text><rect x="99.2" y="274" width="68.4" height="26" rx="3" fill="#4d8dff" fill-opacity=".08" stroke="rgba(77,141,255,.16)"/><text x="108.2" y="291.5" class="m" font-size="12" font-weight="500" fill="#d5e1f4" >Windows</text><rect x="175.6" y="274" width="54.0" height="26" rx="3" fill="#4d8dff" fill-opacity=".08" stroke="rgba(77,141,255,.16)"/><text x="184.6" y="291.5" class="m" font-size="12" font-weight="500" fill="#d5e1f4" >Linux</text><g class="c63a"><text x="570" y="292" text-anchor="end" class="m" font-size="14" font-weight="500" fill="#9cc2ff">↗</text></g></svg>