<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="236" height="64" viewBox="0 0 236 64" role="img" aria-label="Visit Portfolio"><title>Visit Portfolio</title><style>@font-face{font-family:'CP';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'JBM',ui-monospace,Consolas,Menlo,monospace} .d{font-family:'CP','Segoe UI',system-ui,sans-serif} .b{font-family:'PX','Segoe UI',system-ui,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(16px,-12px);opacity:.9}}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
@keyframes pulse{50%{opacity:.35}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.blink{animation:blink 1s steps(1) infinite}
.dot{fill:#78aaff;animation:drift 9s ease-in-out infinite}
.bglow{opacity:.55;animation:bp 2.8s ease-in-out infinite}@keyframes bp{50%{opacity:.95}}
.bsh{transform:translateX(-90px);animation:bsh 3.6s ease-in-out 1s infinite}@keyframes bsh{0%{transform:translateX(-90px)}35%,100%{transform:translateX(256px)}}</style><defs><linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="bg" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="bc"><rect x="8" y="8" width="220" height="48" rx="4"/></clipPath></defs>
<rect class="bglow" x="8" y="8" width="220" height="48" rx="4" fill="#4d8dff" filter="url(#bg)"/>
<rect x="8" y="8" width="220" height="48" rx="4" fill="#4d8dff"/>
<g clip-path="url(#bc)"><rect class="bsh" x="0" y="0" width="70" height="64" fill="url(#bs)"/></g>
<text x="118.0" y="38.0" text-anchor="middle" class="d" font-size="17" font-weight="600" letter-spacing="1" fill="#02060d">VISIT PORTFOLIO  ↗</text></svg>