<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="What I&#x27;ve built"><title>What I&#x27;ve built</title><style>@font-face{font-family:'JBM';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'CP';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'JBM',ui-monospace,Consolas,Menlo,monospace} .d{font-family:'CP','Segoe UI',system-ui,sans-serif} .b{font-family:'PX','Segoe UI',system-ui,sans-serif}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rspin{to{transform:rotate(-360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(16px,-12px);opacity:.9}}
@keyframes rise{}
@keyframes pulse{50%{opacity:.35}}
.rise{}
.blink{animation:blink 1s steps(1) infinite}
.dot{fill:#78aaff;animation:drift 9s ease-in-out infinite}

.psw{transform:translateX(-540px);animation:psw 7s ease-out 0.5s infinite}
@keyframes psw{0%{transform:translateX(-540px)}22%,100%{transform:translateX(1320px)}}
</style><defs>
<linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1a"/><stop offset="1" stop-color="#04080f"/></linearGradient>
<radialGradient id="pgA" cx="82%" cy="-8%" r="70%"><stop offset="0" stop-color="#4d8dff" stop-opacity=".2"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
<radialGradient id="pgB" cx="-8%" cy="70%" r="55%"><stop offset="0" stop-color="#4d8dff" stop-opacity=".1"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></radialGradient>
<pattern id="pscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#4d8dff" fill-opacity=".045"/></pattern>
<linearGradient id="psweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff" stop-opacity="0"/><stop offset=".5" stop-color="#4d8dff" stop-opacity=".13"/><stop offset="1" stop-color="#4d8dff" stop-opacity="0"/></linearGradient>
<clipPath id="pframe"><rect x="1" y="1" width="1198" height="148" rx="10"/></clipPath>
<filter id="pglow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="psoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="148" rx="10" fill="url(#pbg)"/>
<g clip-path="url(#pframe)">
<rect width="1200" height="150" fill="url(#pgA)"/><rect width="1200" height="150" fill="url(#pgB)"/>
<circle class="dot" cx="571" cy="94" r="1.8" style="animation-delay:-3.1s;animation-duration:9.3s"/><circle class="dot" cx="1176" cy="73" r="1.8" style="animation-delay:-7.3s;animation-duration:11.1s"/><circle class="dot" cx="718" cy="82" r="1.8" style="animation-delay:-5.6s;animation-duration:12.9s"/><circle class="dot" cx="446" cy="55" r="1.2" style="animation-delay:-0.5s;animation-duration:11.9s"/><circle class="dot" cx="107" cy="98" r="1.5" style="animation-delay:-6.1s;animation-duration:11.8s"/>
<rect class="psw" x="0" y="0" width="480" height="150" fill="url(#psweep)"/>
</g>
<rect x="1" y="1" width="1198" height="148" rx="10" fill="none" stroke="rgba(77,141,255,.42)" stroke-opacity=".7"/>
<text x="48.0" y="64.0" class="m" font-size="13" font-weight="500" fill="#4d8dff" letter-spacing="2.34" >BUILDER SIDE</text><line x1="182" y1="59.5" x2="254" y2="59.5" stroke="rgba(77,141,255,.42)"/><text x="48.0" y="110.0" class="d" font-size="40" font-weight="700" fill="#eef4ff">What I&#x27;ve built</text><text x="1152.0" y="86.0" class="b" font-size="16" font-weight="400" fill="#7d90b0" text-anchor="end" >Tools I keep as study material. Every repo ships with</text><text x="1152.0" y="110.0" class="b" font-size="16" font-weight="400" fill="#7d90b0" text-anchor="end" >architecture, README, changelog and roadmap.</text></svg>